name: Build and Release

# 触发条件修改：
on:
  push:
    branches: [ "main" ] # 平时修改代码也会编译，确保代码没写错（但不会发布）
    tags:
      - 'v*'             # 核心：当你发布带 v 开头的版本号（如 v1.0.0）时触发发布流程
  workflow_dispatch:

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libheif-dev

      - name: Install dependencies (macOS)
        if: matrix.os == 'macos-latest'
        run: brew install libheif

      - name: Install dependencies (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          vcpkg integrate install
          vcpkg install libheif:x64-windows
        shell: cmd

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Set VCPKG env (Windows)
        if: matrix.os == 'windows-latest'
        run: echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT" >> $GITHUB_ENV
        shell: bash

      - name: Cargo Build Release
        run: cargo build --release

      # [新增] 将编译出来的文件改名，加上系统后缀，避免后面汇总时名字冲突
      - name: Rename Binary (Windows)
        if: matrix.os == 'windows-latest'
        run: move target\release\heic2jpg_rs.exe target\release\heic2jpg-windows.exe
        shell: cmd
        
      - name: Rename Binary (macOS & Ubuntu)
        if: matrix.os != 'windows-latest'
        run: mv target/release/heic2jpg_rs target/release/heic2jpg-${{ matrix.os }}

      # [新增] 上传给后面的 Release 任务使用
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.os }}
          path: target/release/heic2jpg-*

  # [全新任务] 将编译好的文件发布到 Release 面板
  release:
    name: Publish to GitHub Releases
    needs: build # 必须等待上面的 build 任务全部成功才执行
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') # 极其重要：只有在你打版本 Tag 时才执行此任务
    permissions:
      contents: write # 必须赋予写入权限，机器人才能帮你向 Release 里传文件
    steps:
      - name: Download all compiled binaries
        uses: actions/download-artifact@v4
        with:
          pattern: bin-*
          merge-multiple: true # 将三个平台的文件全部下载到当前目录
          
      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            heic2jpg-windows.exe
            heic2jpg-ubuntu-latest
            heic2jpg-macos-latest
          generate_release_notes: true # 自动生成更新日志
