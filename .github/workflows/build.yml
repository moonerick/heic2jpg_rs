name: Build and Release (Windows Only)

# 触发条件：平时推代码测试，打 v 开头的 Tag 时触发正式发布
on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    name: Build on Windows
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 使用 GitHub Actions 自带的 vcpkg 安装 libheif (C 语言依赖)
      - name: Install dependencies (Windows)
        run: |
          vcpkg integrate install
          vcpkg install libheif:x64-windows
        shell: cmd

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # 设置 vcpkg 环境变量供 Rust 编译器读取
      - name: Set VCPKG env
        run: echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT" >> $GITHUB_ENV
        shell: bash

      # 核心编译步骤
      - name: Cargo Build Release
        run: cargo build --release

      # 重命名文件，方便后续发布
      - name: Rename Binary
        run: move target\release\heic2jpg_rs.exe target\release\heic2jpg-windows.exe
        shell: cmd
        
      # 暂存编译好的 exe 文件，传给下游发版任务
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bin-windows
          path: target/release/heic2jpg-windows.exe

  # 发版任务：仅在打 Tag 时运行
  release:
    name: Publish to GitHub Releases
    needs: build-windows
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Download compiled binary
        uses: actions/download-artifact@v4
        with:
          pattern: bin-windows
          merge-multiple: true
          
      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          files: heic2jpg-windows.exe
          generate_release_notes: true
